<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حبيبي 😍</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #fcf8fa; 
            color: #333; 
            text-align: center; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
            padding: 20px 15px 40px 15px; 
            position: relative;
            overflow-x: hidden;
        }

        .heart-bg {
            position: fixed;
            top: -20px;
            color: #ff6b8b;
            opacity: 0.5;
            font-size: 18px;
            animation: fall 6s linear infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .login-card { 
            background: #ffffff; 
            padding: 30px 25px; 
            border-radius: 25px; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 10px 25px rgba(255, 75, 114, 0.12); 
            border: 2px dashed #ff4d6d;
            position: relative;
            z-index: 10;
            margin: auto;
        }
        .login-card h1 { color: #ff2a5f; font-size: 22px; margin-bottom: 15px; }
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 15px 0; 
            border-radius: 15px; 
            border: 1.5px solid #ff85a1; 
            background: #fff0f3; 
            color: #ff2a5f; 
            text-align: center; 
            font-size: 16px; 
            outline: none;
            font-weight: bold;
        }
        .btn-main { 
            background: #ff2a5f; 
            color: #fff; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 50px; 
            font-size: 18px; 
            font-weight: bold; 
            width: 100%; 
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 42, 95, 0.3);
            transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.97); }

        .hidden { display: none !important; }

        .main-container {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .main-title {
            color: #ff124f;
            font-size: 44px;
            font-weight: 900;
            margin: 5px 0;
        }

        .timer-container {
            background: #fff0f3;
            border: 2px dashed #ff85a1;
            border-radius: 20px;
            padding: 20px 10px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 133, 161, 0.15);
        }

        .timer-title {
            color: #4a4a4a;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .timer-grid {
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }

        .time-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 12px 5px;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            color: #ff2a5f;
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 6px;
        }

        .time-label {
            color: #666;
            font-size: 13px;
            font-weight: 500;
        }

        .surprise-card {
            background: #ffffff;
            border: 2px dashed #ff4d6d;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(255, 42, 95, 0.15);
            margin-top: 5px;
        }

        .typing-text { 
            font-size: 15px; 
            color: #ff2a5f; 
            font-weight: bold;
            line-height: 1.8;
            text-align: right;
        }

        .gift-box {
            font-size: 50px;
            margin-top: 5px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .music-pill {
            position: fixed;
            bottom: 25px;
            right: 20px;
            background: #ffffff;
            padding: 8px 15px 8px 10px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            cursor: pointer;
            border: 1px solid #ffe6eb;
        }

        .music-btn {
            width: 32px;
            height: 32px;
            background: #ff2a5f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .music-text {
            color: #ff2a5f;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-card" id="loginCard">
    <h1>اكتب الباسورد يا عمري ❤️</h1>
    <input type="password" id="passInput" placeholder="الباسورد هنا...">
    <button class="btn-main" onclick="checkPass()">دخول ✨</button>
</div>

<div class="main-container hidden" id="mainCard">
    
    <div class="main-title">حبيبي 😍</div>

    <div class="timer-container">
        <div class="timer-title">❤️ مع بعض وحبنا بيكبر بقالنا:</div>
        <div class="timer-grid">
            <div class="time-box">
                <div class="time-number" id="days">0</div>
                <div class="time-label">يوم</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="hours">0</div>
                <div class="time-label">ساعة</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="minutes">0</div>
                <div class="time-label">دقيقة</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="seconds">0</div>
                <div class="time-label">ثانية</div>
            </div>
        </div>
    </div>

    <button class="btn-main" id="btnSurprise" onclick="showMainSurprise()" style="width: 90%; max-width: 320px; margin-top: 10px;">
        دوس يا ابو العيال 🫂
    </button>

    <div style="margin-top: 5px;">
        <div class="gift-box" onclick="openGift()">🎁</div>
        <div style="font-size: 13px; color: #ff2a5f; font-weight: bold;">افتح الهدية دي كمان 🙈👇</div>
    </div>

    <div class="surprise-card hidden" id="surpriseCard">
        <div class="typing-text" id="typewriter"></div>
    </div>

</div>

<div class="music-pill hidden" id="musicPill" onclick="toggleMusic()">
    <span class="music-text">❤️ أغنيتنا</span>
    <div class="music-btn" id="musicIcon">⏸</div>
</div>

<audio id="bgSong" src="song.mp3" loop></audio>

<script>
    function createHearts() {
        const hearts = ['❤️', '💖', '✨', '💕', '🌸'];
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }, 400);
    }
    createHearts();

    const textToType = "بحبك يا نور عيني وبموت فيك وحقك عليا اني مقصره معاك وبزعلك كتير مني واني بنكد عليك علي طول بس انا ماليش غيرك اصلا وربنا يخليك ليا يحبيبي وميحرمنيش منك ابدا ولا اشوف فيك حاجه وحشه واشوفك احسن واحد فالدنيا دي كلها يروح قلبي انت بجد الحياه دي من غيرك ملهاش اي تلاتين لازمه اصلا انت اللي مخلي كل حاجه حلوه وليها طعم كده انت عوض ربنا الحلو 🌚 بحبك وبموت فيك ينور عيني انت 🥺🫂♥️♥️♥️";
    let index = 0;
    let isTyping = false;

    function typeWriter() {
        if (index < textToType.length) {
            document.getElementById("typewriter").innerHTML += textToType.charAt(index);
            index++;
            setTimeout(typeWriter, 35);
        }
    }

    function checkPass() {
        const pass = document.getElementById('passInput').value.trim();
        if(pass === 'حبيبي') {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');
            document.getElementById('musicPill').classList.remove('hidden');
            
            const song = document.getElementById('bgSong');
            song.play().catch(() => {});
            startTimer();
        } else {
            alert('الباسورد غلط يا روحي!');
        }
    }

    function toggleMusic() {
        const song = document.getElementById('bgSong');
        const icon = document.getElementById('musicIcon');
        if (song.paused) {
            song.play();
            icon.innerText = '⏸';
        } else {
            song.pause();
            icon.innerText = '▶';
        }
    }

    function startTimer() {
        const startDate = new Date('2025-09-16T00:00:00');
        setInterval(() => {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }, 1000);
    }

    function showMainSurprise() {
        const surpriseCard = document.getElementById('surpriseCard');
        surpriseCard.classList.remove('hidden');
        
        if (!isTyping) {
            isTyping = true;
            document.getElementById("typewriter").innerHTML = "";
            index = 0;
            typeWriter();
        }
        surpriseCard.scrollIntoView({ behavior: 'smooth' });
    }

    function openGift() {
        alert('بحبك');
    }
</script>

</body>
</html>
