<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حبيبي 😍</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0d0e15; color: #fff; text-align: center; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.08); padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff4b72; font-size: 22px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #ff4b72; background: rgba(0,0,0,0.5); color: #fff; text-align: center; font-size: 16px; }
        button { background: #ff4b72; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%; }
        .hidden { display: none; }
        .timer-box { margin: 20px 0; padding: 15px; background: rgba(255,75,114,0.15); border-radius: 12px; border: 1px dashed #ff4b72; }
        .timer { font-size: 16px; font-weight: bold; color: #ff4b72; margin-top: 5px; }
        .gift-box { font-size: 60px; margin: 20px 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <h1>اكتب الباسورد يا عمري ❤️</h1>
    <input type="password" id="passInput" placeholder="الباسورد هنا...">
    <button onclick="checkPass()">دخول ✨</button>
</div>

<div class="card hidden" id="mainCard">
    <h1>بحبك يا نور عيني ❤️</h1>
    
    <div class="timer-box">
        <div>بقالنا مع بعض:</div>
        <div class="timer" id="timer">جاري الحساب...</div>
    </div>

    <div class="gift-box" onclick="alert('كل سنة وأنت معايا يا أغلى حاجة في حياتي! 🎁❤️')">🎁</div>
    <p style="font-size: 12px; color: #aaa;">اضغط على الهدية 👆</p>

    <audio id="bgSong" src="song.mp3" loop></audio>
</div>

<script>
    function checkPass() {
        const pass = document.getElementById('passInput').value.trim();
        if(pass === 'حبيبي') {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');
            const song = document.getElementById('bgSong');
            song.play().catch(() => {});
            startTimer();
        } else {
            alert('الباسورد غلط يا روحي!');
        }
    }

    function startTimer() {
        const startDate = new Date('2026-05-15T00:00:00');
        setInterval(() => {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerHTML = `${days} يوم و ${hours} ساعة و ${minutes} دقيقة و ${seconds} ثانية`;
        }, 1000);
    }
</script>

</body>
</html>
